<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Discussions</title>
</head>
<body>
<h1>Liste des discussions</h1>
<div th:each="discussion : ${discussions}">
    <hr>

    <h2 th:text="${discussion.title}"></h2>

    <p>
        <strong>Auteur :</strong>
        <span th:text="${discussion.author.username}"></span>
        |
        <strong>Catégorie :</strong>
        <span th:text="${discussion.category}"></span>
    </p>

    <p th:text="${discussion.content}"></p>

    <h4>Réponses</h4>

    <div th:if="${#lists.isEmpty(discussion.responses)}">
        <em>Aucune réponse pour le moment</em>
    </div>

    <div th:each="answer : ${discussion.responses}">
        <p>
            <strong th:text="${answer.author.username}"></strong>
            :
            <span th:text="${answer.content}"></span>
        </p>
    </div>
</div>
</body>
</html>
