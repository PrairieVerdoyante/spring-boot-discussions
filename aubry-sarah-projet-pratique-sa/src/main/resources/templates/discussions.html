<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Discussions</title>
</head>
<body>

<!-- header -->
<div th:replace="fragments/header :: header"></div>

<!-- categories -->
<form method="get" th:action="@{/discussions}">
    <label>Catégorie :</label>
    <select name="category" onchange="this.form.submit()">
        <option value="">Toutes</option>
        <option value="Java" th:selected="${selectedCategory == 'Java'}">Java</option>
        <option value="Spring" th:selected="${selectedCategory == 'Spring'}">Spring</option>
        <option value="SQL" th:selected="${selectedCategory == 'SQL'}">SQL</option>
    </select>
</form>

<h1>Liste des discussions</h1>
<div th:each="discussion : ${discussions}">
    <hr>

    <h2 th:text="${discussion.title}"></h2>

    <p>
        <strong>Auteur :</strong>
        <span th:text="${discussion.user.username}"></span>
        |
        <strong>Catégorie :</strong>
        <span th:text="${discussion.category}"></span>
    </p>

    <p th:text="${discussion.content}"></p>

    <h4>Réponses</h4>

    <div th:if="${#lists.isEmpty(discussion.response)}">
        <em>Aucune réponse pour le moment</em>
    </div>

    <div th:each="answer : ${discussion.response}">
        <p>
            <strong th:text="${answer.user.username}"></strong>
            :
            <span th:text="${answer.content}"></span>
        </p>
    </div>
    <form th:action="@{/answers/create}" method="post">
        <input type="hidden" name="discussionId" th:value="${discussion.id}" />

        <textarea name="content" required
                  placeholder="Votre réponse..."></textarea>

        <button type="submit">Répondre</button>
    </form>

</div>
</body>
</html>
